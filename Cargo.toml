[package]
name = "blvm-ui"
version = "0.1.0"
edition = "2021"
authors = ["Bitcoin Commons Contributors"]
description = "Optional localhost UI for blvm-node (node status only in this slice)"
license = "MIT"
publish = false

[[bin]]
name = "blvm-ui"
path = "src/main.rs"

[lib]
name = "blvm_ui"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hyper = { version = "1.8", features = ["server", "http1"] }
hyper-util = { version = "0.1.18", features = ["server", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt"] }
